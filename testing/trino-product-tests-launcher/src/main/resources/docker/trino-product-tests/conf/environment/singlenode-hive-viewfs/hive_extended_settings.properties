# A combination of Hive settings commonly used together with ViewFS, including S3 path-style access, timeouts, part size and SSE-S3
connector.name=hive
hive.metastore.uri=thrift://hadoop-master:9083
hive.parquet.use-column-names=true
hive.recursive-directories=true
hive.metastore.thrift.impersonation.enabled=false
hive.hdfs.impersonation.enabled=false
fs.hadoop.enabled=true
hive.non-managed-table-writes-enabled=true
hive.config.resources=/docker/trino-product-tests/conf/trino/etc/hive-default-fs-site.xml,/docker/trino-product-tests/conf/environment/singlenode-hive-viewfs/viewfs-core-site.xml
hive.ignore-absent-partitions=true
hive.hive-views.enabled=true
hive.hive-views.run-as-invoker=true
hive.metastore-cache-ttl=6h
hive.metastore-refresh-interval=2h
hive.metastore-cache-maximum-size=10000000
hive.parquet.time-zone=UTC
hive.rcfile.time-zone=UTC
# Legacy S3 file system serving the ViewFS s3a:// mount link
hive.s3.aws-access-key=minio-access-key
hive.s3.aws-secret-key=minio-secret-key
hive.s3.endpoint=http://minio:9080
hive.s3.ssl.enabled=false
hive.s3.path-style-access=true
hive.s3.connect-timeout=30s
hive.s3.multipart.min-part-size=128MB
hive.s3.sse.enabled=true
hive.s3.sse.type=S3
