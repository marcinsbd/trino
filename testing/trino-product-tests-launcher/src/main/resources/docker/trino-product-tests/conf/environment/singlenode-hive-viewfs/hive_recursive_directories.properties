connector.name=hive
hive.metastore.uri=thrift://hadoop-master:9083
hive.config.resources=/docker/trino-product-tests/conf/trino/etc/hive-default-fs-site.xml,/docker/trino-product-tests/conf/environment/singlenode-hive-viewfs/viewfs-core-site.xml
hive.metastore-cache-ttl=0s
hive.parquet.time-zone=UTC
hive.rcfile.time-zone=UTC
fs.hadoop.enabled=true
hive.non-managed-table-writes-enabled=true
# Read files in subdirectories of table and partition directories
hive.recursive-directories=true
# Legacy S3 file system, registered as fs.s3a.impl for the ViewFS s3a:// mount link
hive.s3.aws-access-key=minio-access-key
hive.s3.aws-secret-key=minio-secret-key
hive.s3.endpoint=http://minio:9080
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
